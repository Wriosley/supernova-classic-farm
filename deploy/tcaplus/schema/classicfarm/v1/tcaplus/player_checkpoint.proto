syntax = "proto3";

package classicfarm.tcaplus.v1;

import "tcaplusservice.optionv1.proto";

option go_package = "github.com/Wriosley/supernova-classic-farm/server/gen/classicfarm/v1/tcaplus;tcaplusv1";

// PlayerCheckpoint is the TcaplusDB PB table envelope. checkpoint_blob remains
// the canonical deterministic PlayerCheckpointV1 payload used by the Actor.
message PlayerCheckpoint {
  option (tcaplusservice.tcaplus_primary_key) = "player_id";

  uint64 player_id = 1;
  uint32 logical_shard_id = 2;
  uint64 owner_epoch = 3;
  uint64 player_seq = 4;
  uint64 checkpoint_revision = 5;
  uint32 checkpoint_schema_version = 6;
  bytes checkpoint_blob = 7;
  bytes checkpoint_sha256 = 8;
  uint64 last_applied_config_version = 9;
  int64 created_at_ms = 10;
  int64 updated_at_ms = 11;
}
