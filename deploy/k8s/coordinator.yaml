apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: classic-farm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coordinator
        app.kubernetes.io/part-of: classic-farm
    spec:
      serviceAccountName: coordinator
      containers:
        - name: coordinator
          image: classic-farm/coordinator:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: classic-farm-runtime
            - secretRef:
                name: classic-farm-tcaplus
            - secretRef:
                name: classic-farm-internal-rpc
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: COORDINATOR_PORT
              value: ""
            - name: HTTP_ADDRESS
              value: 0.0.0.0:8083
            - name: ZONE_A_ID
              value: zone-a
            - name: ZONE_A_ENDPOINT
              value: http://zone-a:8082
            - name: ZONE_B_ID
              value: zone-b
            - name: ZONE_B_ENDPOINT
              value: http://zone-b:8082
            - name: ZONE_C_ID
              value: d859cea1-ac5b-5524-bffa-4e542301cd95
            - name: ZONE_C_ENDPOINT
              value: http://zone-pool-0.zone-headless.classic-farm.svc.cluster.local:8082
            - name: COORDINATOR_MEMBERSHIP_SOURCE
              value: kubernetes
            - name: COORDINATOR_MIGRATION_WORKER_ENABLED
              value: "1"
            - name: COORDINATOR_PLANNER_ENABLED
              value: "0"
          ports:
            - name: http
              containerPort: 8083
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            # A deliberate 4096-row Tcaplus bootstrap/reinitialize is
            # rate-limited and may take several minutes. Normal starts become
            # ready immediately after loading the committed snapshot.
            failureThreshold: 1800
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
