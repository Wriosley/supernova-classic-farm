apiVersion: apps/v1
kind: Deployment
metadata:
  name: zone-a
  namespace: classic-farm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zone
      classic-farm/zone-id: zone-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zone
        app.kubernetes.io/part-of: classic-farm
        classic-farm/zone-id: zone-a
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: zone
          image: classic-farm/zone:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: classic-farm-runtime
            - secretRef:
                name: classic-farm-tcaplus
            - secretRef:
                name: classic-farm-internal-rpc
          env:
            - name: OWNER_ZONE_ID
              value: zone-a
            - name: ZONE_HTTP_ADDRESS
              value: 0.0.0.0:8082
            - name: GATE_RPC_URL
              value: http://gate:8081
          ports:
            - name: http
              containerPort: 8082
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
