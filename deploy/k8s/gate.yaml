apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate
  namespace: classic-farm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gate
        app.kubernetes.io/part-of: classic-farm
    spec:
      containers:
        - name: gate
          image: classic-farm/gate:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: classic-farm-runtime
            - secretRef:
                name: classic-farm-internal-rpc
          env:
            - name: GATE_PORT
              value: ""
            - name: HTTP_ADDRESS
              value: 0.0.0.0:8081
            - name: LOGIN_TICKET_CONSUME_URL
              value: http://login:8080/internal/v1/ws-tickets/consume
            - name: CLIENT_CONFIG_URL
              value: http://login:8080/v1/client-config/1
            # Must match login.yaml CLIENT_CONFIG_URL: this one reaches the browser.
            - name: CLIENT_CONFIG_PUBLIC_URL
              value: http://localhost:8080/v1/client-config/1
          ports:
            - name: http
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
