apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gate
  namespace: classic-farm
spec:
  serviceName: gate-headless
  podManagementPolicy: Parallel
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/name: gate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gate
        app.kubernetes.io/part-of: classic-farm
    spec:
      containers:
        - name: gate
          image: classic-farm/gate:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: classic-farm-runtime
            - secretRef:
                name: classic-farm-internal-rpc
          env:
            - name: GATE_PORT
              value: ""
            - name: HTTP_ADDRESS
              value: 0.0.0.0:8081
            - name: GATEWAY_ID
              value: local-gateway
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GATE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: GATE_ADVERTISED_ENDPOINT
              value: http://$(POD_NAME).gate-headless.$(POD_NAMESPACE).svc.cluster.local:8081
            - name: LOGIN_TICKET_CONSUME_URL
              value: http://login:8080/internal/v1/ws-tickets/consume
            - name: CLIENT_CONFIG_URL
              value: http://login:8080/v1/client-config/1
            # First-pass loadtest budget on 8C/16G with gate×6 + zone×8.
            - name: GOMEMLIMIT
              value: "900MiB"
          ports:
            - name: http
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 400m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
