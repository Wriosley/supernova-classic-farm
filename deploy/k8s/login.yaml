apiVersion: apps/v1
kind: Deployment
metadata:
  name: login
  namespace: classic-farm
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: login
  template:
    metadata:
      labels:
        app.kubernetes.io/name: login
        app.kubernetes.io/part-of: classic-farm
    spec:
      containers:
        - name: login
          image: classic-farm/login:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: classic-farm-runtime
            - secretRef:
                name: classic-farm-tcaplus
          env:
            - name: LOGIN_PORT
              value: ""
            - name: HTTP_ADDRESS
              value: 0.0.0.0:8080
            - name: GATEWAY_ID
              value: local-gateway
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
