apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: classic-farm
spec:
  selector:
    app.kubernetes.io/name: coordinator
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: login
  namespace: classic-farm
  annotations:
    service.kubernetes.io/tke-existed-lbid: lb-n9maz47a
spec:
  selector:
    app.kubernetes.io/name: login
  type: LoadBalancer
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 31238
---
apiVersion: v1
