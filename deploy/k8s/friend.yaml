apiVersion: apps/v1
kind: Deployment
metadata:
  name: friend
  namespace: classic-farm
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: friend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: friend
        app.kubernetes.io/part-of: classic-farm
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: friend
      containers:
        - name: friend
          image: classic-farm/friend:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: classic-farm-runtime
            - secretRef:
                name: classic-farm-tcaplus
            - secretRef:
                name: classic-farm-internal-rpc
          env:
            - name: FRIEND_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FRIEND_PORT
              value: ""
            - name: HTTP_ADDRESS
              value: 0.0.0.0:8085
          ports:
            - name: http
              containerPort: 8085
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
