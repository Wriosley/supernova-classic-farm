apiVersion: v1
kind: ConfigMap
metadata:
  name: classic-farm-runtime
  namespace: classic-farm
data:
  APP_ENV: development
  LOG_LEVEL: info
  STORAGE_MODE: tcaplus
  INTERNAL_NETWORK_MODE: kubernetes
  ROUTING_MODE: static-dual-zone
  COORDINATOR_ROUTE_STORE: tcaplus
  COORDINATOR_ROUTE_REINITIALIZE: "false"
  COORDINATOR_MEMBERSHIP_SOURCE: kubernetes
  CLUSTER_ID: classic-farm-local
  ZONE_DISCOVERY_SERVICE: zone-discovery
  ZONE_HEADLESS_SERVICE: zone-headless
  COORDINATOR_URL: http://coordinator:8083
  COORDINATOR_RPC_URL: http://coordinator:8083
  GATE_ROUTE_SOURCE: coordinator-sdk
  INFO_ROUTE_SOURCE: coordinator-sdk
  ZONE_ROUTE_SOURCE: coordinator-sdk
  ZONE_ROUTE_VERIFY_INTERVAL: 5m
  FRIEND_RPC_URL: dns:///friend-headless.classic-farm.svc.cluster.local:8085
  INFO_RPC_URL: http://info:8086
  MAIL_RPC_URL: dns:///mail-headless.classic-farm.svc.cluster.local:8087
  H5_ORIGIN: http://21.130.223.195:1616
  GATEWAY_URL: ws://21.214.142.172:8081/ws
  CLIENT_CONFIG_URL: http://21.214.142.172:8080/v1/client-config/1
  CLIENT_CONFIG_PUBLIC_URL: http://21.214.142.172:8080/v1/client-config/1
  TCAPLUS_CHECKPOINT_TABLE: PlayerCheckpoint
  TCAPLUS_PLAYER_ID_COUNTER_TABLE: PlayerIdCounter
  TCAPLUS_ACCOUNT_BY_NAME_TABLE: AccountByName
  TCAPLUS_ACCOUNT_BY_PLAYER_TABLE: AccountByPlayer
  TCAPLUS_SESSION_TABLE: Session
  TCAPLUS_FENCE_TABLE: ShardFence
  TCAPLUS_MIGRATION_TABLE: MigrationProgress
  TCAPLUS_MIGRATION_TASK_TABLE: MigrationTask
  TCAPLUS_SHARD_MAP_META_TABLE: ShardMapMeta
  TCAPLUS_SHARD_ROUTE_TABLE: ShardRoute
  TCAPLUS_OUTBOX_TABLE: PlayerOutbox
  COORDINATOR_PLANNER_ENABLED: "1"
  COORDINATOR_PLANNER_INTERVAL: 30s
  COORDINATOR_MIGRATION_WORKER_ENABLED: "1"
  COORDINATOR_DRAIN_ZONE_IDS: zone-a,zone-b
  COORDINATOR_PLANNER_MIN_HEALTHY_ZONES: "8"
  TCAPLUS_FRIEND_CODE_CURRENT_TABLE: FriendCodeCurrent
  TCAPLUS_FRIEND_CODE_LOOKUP_TABLE: FriendCodeLookup
  TCAPLUS_FRIEND_RELATION_TABLE: FriendRelation
  TCAPLUS_FRIEND_LIST_TABLE: FriendList
  TCAPLUS_FRIEND_LINK_SAGA_TABLE: FriendLinkSaga
  TCAPLUS_FRIEND_INTERACTION_TABLE: FriendInteraction
  TCAPLUS_FIRST_FRIEND_REWARD_TABLE: FirstFriendReward
  PUBLIC_WEB_BASE_URL: http://21.130.223.195:1616
  TCAPLUS_PUBLIC_MAIL_TABLE: PublicMail
  TCAPLUS_PRIVATE_MAIL_TABLE: PrivateMail
  TCAPLUS_PLAYER_MAILBOX_CURSOR_TABLE: PlayerMailboxCursor
  TCAPLUS_PLAYER_MAIL_STATE_TABLE: PlayerMailState
  TCAPLUS_MAIL_SOURCE_DEDUP_TABLE: MailSourceDedup
  TCAPLUS_MAIL_CLAIM_SAGA_TABLE: MailClaimSaga
