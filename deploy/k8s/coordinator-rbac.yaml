apiVersion: v1
kind: ServiceAccount
metadata:
  name: coordinator
  namespace: classic-farm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coordinator-zone-discovery
  namespace: classic-farm
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coordinator-zone-discovery
  namespace: classic-farm
subjects:
  - kind: ServiceAccount
    name: coordinator
    namespace: classic-farm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coordinator-zone-discovery
