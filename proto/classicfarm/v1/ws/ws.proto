syntax = "proto3";

package classicfarm.ws.v1;

import "classicfarm/v1/ws/chapter/chapter_status.proto";
import "classicfarm/v1/ws/plot/plot_state.proto";
import "classicfarm/v1/ws/reason/state_change_reason.proto";

option go_package = "github.com/Wriosley/supernova-classic-farm/server/gen/classicfarm/v1/ws;wsv1";

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  REQUEST = 1;
  RESPONSE = 2;
  PUSH = 3;
}

enum Action {
  ACTION_UNSPECIFIED = 0;
  AUTH = 1;
  PING = 2;
  reserved 3 to 99;
  GET_PLAYER_SNAPSHOT = 100;
  GET_SHOP = 101;
  GET_PET_PANEL = 102;
  reserved 103 to 199;
  BUY_SEEDS = 200;
  PLANT = 201;
  APPLY_FERTILIZER = 202;
  HARVEST = 203;
  CLEAN_PLOT = 204;
  SELL_CROP = 205;
  CLAIM_CHAPTER_REWARD = 206;
  BUY_FERTILIZER = 207;
  CATCH_PEST = 208;
  BUY_PET = 209;
  DEPLOY_PET = 210;
  BUY_PET_FOOD = 211;
  FEED_PET = 212;
  reserved 213 to 299;
  CREATE_FRIEND_CODE = 300;
  REDEEM_FRIEND_CODE = 301;
  LIST_FRIENDS = 302;
  reserved 303 to 309;
  ENTER_FRIEND_FARM = 310;
  FARM_HEARTBEAT = 311;
  EXIT_FRIEND_FARM = 312;
  reserved 313 to 319;
  APPLY_PEST_TO_FRIEND = 320;
  CATCH_PEST_FOR_FRIEND = 321;
  HELP_CLEAN_FRIEND_PLOT = 322;
  STEAL_FRIEND_CROP = 323;
  SEND_FRIEND_GIFT = 324;
  CLAIM_MAIL = 325;
  OPEN_MAILBOX = 326;
  MARK_MAIL_READ = 327;
  CHECK_MAILBOX_INDICATOR = 328;
  reserved 329 to 999;
  PLAYER_STATE_CHANGED = 1000;
  reserved 1001 to 1099;
  FARM_VIEW_CHANGED = 1100;
  FARM_PRESENCE_CHANGED = 1101;
  RED_DOT_CHANGED = 1102;
  reserved 1103 to 1999;
}

enum ErrorCode {
  ERROR_UNSPECIFIED = 0;
  INVALID_ARGUMENT = 100;
  UNKNOWN_ACTION = 101;
  UNSUPPORTED_PROTOCOL_VERSION = 102;
  UNAUTHENTICATED = 103;
  FORBIDDEN = 104;
  REQUEST_ID_CONFLICT = 105;
  RATE_LIMITED = 106;
  SERVICE_UNAVAILABLE = 200;
  SERVER_BUSY = 201;
  REQUEST_OUTCOME_UNKNOWN = 202;
  CONFIG_UNAVAILABLE = 203;
  SHOP_ENTRY_NOT_FOUND = 300;
  SHOP_ENTRY_DISABLED = 301;
  PRICE_CHANGED = 302;
  CONFIG_ENTRY_DISABLED = 303;
  INSUFFICIENT_COINS = 400;
  INVENTORY_TYPE_LIMIT = 401;
  INVENTORY_STACK_LIMIT = 402;
  ITEM_NOT_OWNED = 403;
  INSUFFICIENT_ITEM_QUANTITY = 404;
  ITEM_NOT_SELLABLE = 405;
  PLOT_NOT_FOUND = 500;
  PLOT_STATE_CONFLICT = 501;
  FERTILIZER_ALREADY_ACTIVE = 502;
  CROP_NOT_MATURE = 503;
  CHAPTER_NOT_FOUND = 600;
  CHAPTER_NOT_CLAIMABLE = 601;
  CHAPTER_REWARD_ALREADY_CLAIMED = 602;
  FRIEND_CODE_NOT_FOUND = 700;
  FRIEND_CODE_EXPIRED = 701;
  CANNOT_FRIEND_SELF = 702;
  FRIEND_LIMIT_REACHED = 703;
  NOT_MUTUAL_FRIEND = 704;
  VISIT_NOT_FOUND = 705;
  VISIT_EXPIRED = 706;
  PLOT_NOT_ELIGIBLE = 720;
  PEST_ALREADY_PRESENT = 721;
  PEST_SOURCE_FORBIDDEN = 722;
  STEAL_NOT_AVAILABLE = 723;
  INSUFFICIENT_ACTION_CHANCE = 724;
  INVENTORY_CAPACITY_EXCEEDED = 725;
  INTERACTION_OUTCOME_UNKNOWN = 726;
  PET_NOT_FOUND = 800;
  PET_ALREADY_OWNED = 801;
  PET_NOT_OWNED = 802;
  PET_DISABLED = 803;
}

message WsEnvelope {
  uint32 protocol_version = 1;
  MessageKind message_kind = 2;
  Action action = 3;
  string request_id = 4;
  uint64 target_player_id = 5;
  StateVersion state_version = 6;
  int64 server_time_ms = 7;
  bool replayed = 8;
  Error error = 9;
  oneof payload {
    AuthRequest auth_request = 10;
    AuthResponse auth_response = 11;
    PingRequest ping_request = 12;
    PingResponse ping_response = 13;
    GetPlayerSnapshotRequest get_player_snapshot_request = 14;
    GetPlayerSnapshotResponse get_player_snapshot_response = 15;
    GetShopRequest get_shop_request = 16;
    GetShopResponse get_shop_response = 17;
    BuySeedsRequest buy_seeds_request = 18;
    BuySeedsResponse buy_seeds_response = 19;
    PlantRequest plant_request = 20;
    PlantResponse plant_response = 21;
    ApplyFertilizerRequest apply_fertilizer_request = 22;
    ApplyFertilizerResponse apply_fertilizer_response = 23;
    HarvestRequest harvest_request = 24;
    HarvestResponse harvest_response = 25;
    CleanPlotRequest clean_plot_request = 26;
    CleanPlotResponse clean_plot_response = 27;
    SellCropRequest sell_crop_request = 28;
    SellCropResponse sell_crop_response = 29;
    ClaimChapterRewardRequest claim_chapter_reward_request = 30;
    ClaimChapterRewardResponse claim_chapter_reward_response = 31;
    PlayerStateChangedPush player_state_changed_push = 32;
    BuyFertilizerRequest buy_fertilizer_request = 33;
    BuyFertilizerResponse buy_fertilizer_response = 34;
    CreateFriendCodeRequest create_friend_code_request = 35;
    CreateFriendCodeResponse create_friend_code_response = 36;
    RedeemFriendCodeRequest redeem_friend_code_request = 37;
    RedeemFriendCodeResponse redeem_friend_code_response = 38;
    ListFriendsRequest list_friends_request = 39;
    ListFriendsResponse list_friends_response = 40;
    EnterFriendFarmRequest enter_friend_farm_request = 41;
    EnterFriendFarmResponse enter_friend_farm_response = 42;
    FarmHeartbeatRequest farm_heartbeat_request = 43;
    FarmHeartbeatResponse farm_heartbeat_response = 44;
    ExitFriendFarmRequest exit_friend_farm_request = 45;
    ExitFriendFarmResponse exit_friend_farm_response = 46;
    ApplyPestToFriendRequest apply_pest_to_friend_request = 47;
    FriendActionResponse apply_pest_to_friend_response = 48;
    CatchPestForFriendRequest catch_pest_for_friend_request = 49;
    FriendActionResponse catch_pest_for_friend_response = 50;
    HelpCleanFriendPlotRequest help_clean_friend_plot_request = 51;
    FriendActionResponse help_clean_friend_plot_response = 52;
    StealFriendCropRequest steal_friend_crop_request = 53;
    FriendActionResponse steal_friend_crop_response = 54;
    FarmViewPatch farm_view_changed_push = 55;
    FarmPresencePush farm_presence_changed_push = 56;
    CatchPestRequest catch_pest_request = 57;
    CatchPestResponse catch_pest_response = 58;
    GetPetPanelRequest get_pet_panel_request = 59;
    GetPetPanelResponse get_pet_panel_response = 60;
    BuyPetRequest buy_pet_request = 61;
    BuyPetResponse buy_pet_response = 62;
    DeployPetRequest deploy_pet_request = 63;
    DeployPetResponse deploy_pet_response = 64;
    BuyPetFoodRequest buy_pet_food_request = 65;
    BuyPetFoodResponse buy_pet_food_response = 66;
    FeedPetRequest feed_pet_request = 67;
    FeedPetResponse feed_pet_response = 68;
    RedDotChangedPush red_dot_changed_push = 69;
    SendFriendGiftRequest send_friend_gift_request = 70;
    SendFriendGiftResponse send_friend_gift_response = 71;
    ClaimMailRequest claim_mail_request = 72;
    ClaimMailResponse claim_mail_response = 73;
    OpenMailboxRequest open_mailbox_request = 74;
    OpenMailboxResponse open_mailbox_response = 75;
    MarkMailReadRequest mark_mail_read_request = 76;
    MarkMailReadResponse mark_mail_read_response = 77;
    CheckMailboxIndicatorRequest check_mailbox_indicator_request = 78;
    CheckMailboxIndicatorResponse check_mailbox_indicator_response = 79;
  }
  reserved 80 to 99;
}

message StateVersion {
  uint64 owner_epoch = 1;
  uint64 player_seq = 2;
}

message ErrorParam {
  string key = 1;
  string value = 2;
}

message Error {
  ErrorCode code = 1;
  repeated ErrorParam params = 2;
  bool retryable = 3;
  optional uint32 retry_after_ms = 4;
  optional ShopEntryView latest_shop_entry = 5;
  optional PlotView current_plot = 6;
  optional string debug_message = 7;
}

message AuthRequest {
  string ws_ticket = 1;
}

message AuthResponse {
  uint64 player_id = 1;
  uint32 heartbeat_interval_ms = 2;
  uint64 client_config_version = 3;
  string client_config_url = 4;
  bytes client_config_sha256 = 5;
  uint32 protocol_min = 6;
  uint32 protocol_max = 7;
}

message PingRequest {
  uint64 ping_id = 1;
  int64 client_sent_at_ms = 2;
}

message PingResponse {
  uint64 ping_id = 1;
  int64 client_sent_at_ms = 2;
}

message GetShopRequest {}

message GetShopResponse {
  uint64 server_config_version = 1;
  repeated ShopEntryView entries = 2;
  repeated CropCatalogEntryView crops = 3;
}

message ShopEntryView {
  uint32 shop_entry_id = 1;
  uint32 item_id = 2;
  int64 unit_price = 3;
  uint64 price_version = 4;
  bool enabled = 5;
}

message GetPlayerSnapshotRequest {}

message GetPlayerSnapshotResponse {
  PlayerSnapshot snapshot = 1;
}

message PlayerSnapshot {
  uint64 player_id = 1;
  int64 coin_balance = 2;
  repeated ItemStackView inventory = 3;
  repeated PlotView plots = 4;
  ChapterView current_chapter = 5;
  uint64 server_config_version = 6;
  PlayerCareerView career = 7;
  CropCompendiumView crop_compendium = 8;
}

message PlayerCareerView {
  uint64 total_harvested_crop_quantity = 1;
  uint64 total_stolen_crop_quantity = 2;
}

message CropCompendiumView {
  repeated uint32 unlocked_crop_ids = 1;
}

message CropCatalogEntryView {
  uint32 crop_id = 1;
  string name = 2;
  uint32 seed_item_id = 3;
  uint32 crop_item_id = 4;
  uint64 maturity_seconds = 5;
  uint32 base_yield = 6;
  int64 seed_unit_price = 7;
  uint64 seed_price_version = 8;
  uint32 seed_shop_entry_id = 9;
  int64 sell_unit_price = 10;
  uint64 sell_price_version = 11;
}

message ItemStackView {
  uint32 item_id = 1;
  uint32 quantity = 2;
}

message EffectView {
  string effect_instance_id = 1;
  uint32 effect_item_id = 2;
  uint64 effect_config_version = 3;
  int64 start_at_ms = 4;
  int64 end_at_ms = 5;
  optional uint64 source_player_id = 6;
}

message PlotView {
  uint32 plot_id = 1;
  .classicfarm.ws.v1.plot.PlotState plot_state = 2;
  uint32 crop_id = 3;
  uint64 crop_config_version = 4;
  int64 planted_at_ms = 5;
  int64 estimated_mature_at_ms = 6;
  uint32 harvestable_quantity = 7;
  EffectView fertilizer_effect = 8;
  EffectView pest_effect = 9;
}

message ChapterView {
  uint32 chapter_id = 1;
  .classicfarm.ws.v1.chapter.ChapterStatus status = 2;
  repeated TaskProgressView tasks = 3;
}

message TaskProgressView {
  uint32 task_id = 1;
  uint32 current_value = 2;
  uint32 target_value = 3;
  bool completed = 4;
}

message PlayerStatePatch {
  optional int64 coin_balance = 1;
  repeated ItemStackView inventory_upserts = 2;
  repeated uint32 inventory_removed_item_ids = 3;
  repeated PlotView plot_upserts = 4;
  optional ChapterView current_chapter = 5;
  optional PlayerCareerView career = 6;
  optional CropCompendiumView crop_compendium = 7;
}

message BuySeedsRequest {
  uint32 shop_entry_id = 1;
  uint32 quantity = 2;
  uint64 expected_price_version = 3;
}

message BuySeedsResponse {
  uint32 shop_entry_id = 1;
  uint32 item_id = 2;
  uint32 quantity = 3;
  int64 unit_price = 4;
  int64 total_price = 5;
  PlayerStatePatch patch = 6;
}

message BuyFertilizerRequest {
  uint32 shop_entry_id = 1;
  uint32 quantity = 2;
  uint64 expected_price_version = 3;
}

message BuyFertilizerResponse {
  uint32 shop_entry_id = 1;
  uint32 item_id = 2;
  uint32 quantity = 3;
  int64 unit_price = 4;
  int64 total_price = 5;
  PlayerStatePatch patch = 6;
}

message PlantRequest {
  uint32 plot_id = 1;
  uint32 seed_item_id = 2;
}

message PlantResponse {
  uint32 consumed_seed_item_id = 1;
  PlayerStatePatch patch = 2;
}

message ApplyFertilizerRequest {
  uint32 plot_id = 1;
  uint32 fertilizer_item_id = 2;
}

message ApplyFertilizerResponse {
  uint32 consumed_fertilizer_item_id = 1;
  string effect_instance_id = 2;
  PlayerStatePatch patch = 3;
}

message HarvestRequest {
  uint32 plot_id = 1;
}

message HarvestResponse {
  uint32 crop_item_id = 1;
  uint32 harvested_quantity = 2;
  PlayerStatePatch patch = 3;
}

message CleanPlotRequest {
  uint32 plot_id = 1;
}

message CleanPlotResponse {
  PlayerStatePatch patch = 1;
}

message CatchPestRequest {
  uint32 plot_id = 1;
}

message CatchPestResponse {
  PlayerStatePatch patch = 1;
}

message SellCropRequest {
  uint32 crop_item_id = 1;
  uint64 expected_price_version = 2;
  oneof amount {
    uint32 quantity = 3;
    bool sell_all = 4;
  }
}

message SellCropResponse {
  uint32 crop_item_id = 1;
  uint32 sold_quantity = 2;
  int64 unit_price = 3;
  int64 total_price = 4;
  PlayerStatePatch patch = 5;
}

message ClaimChapterRewardRequest {
  uint32 chapter_id = 1;
}

message ClaimChapterRewardResponse {
  uint32 chapter_id = 1;
  int64 coin_granted = 2;
  repeated ItemStackView items_added_to_inventory = 3;
  repeated ItemStackView items_pending_mail = 4;
  PlayerStatePatch patch = 5;
}

message PlayerStateChangedPush {
  .classicfarm.ws.v1.reason.StateChangeReason reason = 1;
  optional string caused_by_request_id = 2;
  PlayerStatePatch patch = 3;
}

message CreateFriendCodeRequest {}

message CreateFriendCodeResponse {
  string code = 1;
  int64 created_at_ms = 2;
  int64 expires_at_ms = 3;
  string share_url = 4;
}

message RedeemFriendCodeRequest {
  string code = 1;
}

message RedeemFriendCodeResponse {
  FriendView friend = 1;
  bool newly_created = 2;
}

message ListFriendsRequest {}

message ListFriendsResponse {
  repeated FriendView friends = 1;
}

message FriendView {
  uint64 player_id = 1;
  string account_name = 2;
  int64 created_at_ms = 3;
}

message FarmViewVersion {
  bytes farm_view_epoch = 1;
  uint64 farm_view_seq = 2;
}

message PublicPlotView {
  uint32 plot_id = 1;
  .classicfarm.ws.v1.plot.PlotState plot_state = 2;
  uint32 crop_id = 3;
  int64 estimated_mature_at_ms = 4;
  uint32 harvestable_quantity = 5;
  bool pest_active = 6;
  bool can_steal = 7;
  uint32 crop_item_id = 8;
  uint32 steal_count = 9;
}

// PublicPetView 是访客在农田旁看到的护卫宠物。active_pet_id=0 表示尚未派出
// （客户端显示「尚未获得宠物」）；不含狗粮库存等私有字段。
message PublicPetView {
  uint32 active_pet_id = 1;
  string pet_name = 2;
  int64 food_active_until_ms = 3;
}

message FarmVisitSnapshot {
  uint64 owner_player_id = 1;
  FarmViewVersion version = 2;
  repeated PublicPlotView plots = 3;
  // 访客可见的公开生涯；不含私有图鉴。
  PlayerCareerView career = 4;
  PublicPetView pet = 5;
}

message FarmViewPatch {
  uint64 owner_player_id = 1;
  FarmViewVersion version = 2;
  repeated PublicPlotView plot_upserts = 3;
}

enum FarmPresenceKind {
  FARM_PRESENCE_KIND_UNSPECIFIED = 0;
  FARM_VISITOR_ENTERED = 1;
  FARM_VISITOR_LEFT = 2;
}

message FarmPresencePush {
  uint64 owner_player_id = 1;
  FarmPresenceKind kind = 2;
  optional string visitor_account_name = 3;
}

enum RedDotCategory {
  RED_DOT_CATEGORY_UNSPECIFIED = 0;
  RED_DOT_CATEGORY_MAIL = 1;
  RED_DOT_CATEGORY_FRIEND_FARM = 2;
}

enum RedDotOperation {
  RED_DOT_OPERATION_UNSPECIFIED = 0;
  RED_DOT_OPERATION_SET = 1;
  RED_DOT_OPERATION_CLEAR = 2;
}

// RedDotChangedPush is unversioned; H5 clears locally on click. Loss is OK.
message RedDotChangedPush {
  string notification_id = 1;
  RedDotCategory category = 2;
  RedDotOperation operation = 3;
  optional uint64 source_player_id = 4;
}

message EnterFriendFarmRequest {
  uint64 owner_player_id = 1;
}

message EnterFriendFarmResponse {
  bytes visit_id = 1;
  int64 expires_at_ms = 2;
  FarmVisitSnapshot snapshot = 3;
}

message FarmHeartbeatRequest {
  uint64 owner_player_id = 1;
  bytes visit_id = 2;
}

message FarmHeartbeatResponse {
  int64 expires_at_ms = 1;
}

message ExitFriendFarmRequest {
  uint64 owner_player_id = 1;
  bytes visit_id = 2;
}

message ExitFriendFarmResponse {}

message ApplyPestToFriendRequest {
  uint64 owner_player_id = 1;
  bytes visit_id = 2;
  uint32 plot_id = 3;
  uint32 pest_id = 4;
}

message CatchPestForFriendRequest {
  uint64 owner_player_id = 1;
  bytes visit_id = 2;
  uint32 plot_id = 3;
}

message HelpCleanFriendPlotRequest {
  uint64 owner_player_id = 1;
  bytes visit_id = 2;
  uint32 plot_id = 3;
}

message StealFriendCropRequest {
  uint64 owner_player_id = 1;
  bytes visit_id = 2;
  uint32 plot_id = 3;
  // expected_crop_item_id comes from the visitor's public farm view and is
  // used only to reserve inventory / reject obviously stale requests. The
  // owner Actor remains authoritative.
  uint32 expected_crop_item_id = 4;
  bytes farm_view_epoch = 5;
  uint64 farm_view_seq = 6;
}

message FriendActionResponse {
  bytes interaction_id = 1;
  PlayerStatePatch visitor_patch = 2;
  FarmViewPatch farm_patch = 3;
  // steal_guard 仅 STEAL_FRIEND_CROP 使用：owner apply 冻结判定，visitor commit 填入实扣罚款。
  StealGuardOutcome steal_guard = 4;
}

// StealGuardOutcome 冻结护主抽奖结果，Saga 重试不得重新抽取。
message StealGuardOutcome {
  uint32 pet_id = 1;
  uint64 pet_config_version = 2;
  bool food_active = 3;
  uint32 guard_probability_bps = 4;
  bool guard_triggered = 5;
  int64 guard_penalty_configured = 6;
  int64 guard_penalty_applied = 7;
}

message PetShopEntryView {
  uint32 pet_id = 1;
  string name = 2;
  int64 price_coins = 3;
  uint32 guard_probability_bps = 4;
  int64 guard_penalty_coins = 5;
  uint64 config_version = 6;
  bool enabled = 7;
  bool owned = 8;
}

message PetFoodShopView {
  uint32 shop_entry_id = 1;
  uint32 item_id = 2;
  int64 unit_price = 3;
  uint64 price_version = 4;
  uint64 duration_seconds = 5;
  bool enabled = 6;
}

message PetPanelView {
  repeated PetShopEntryView pets = 1;
  PetFoodShopView pet_food = 2;
  repeated uint32 owned_pet_ids = 3;
  uint32 active_pet_id = 4;
  uint32 pet_food_quantity = 5;
  int64 food_active_until_ms = 6;
  bool guard_buff_active = 7;
}

message GetPetPanelRequest {}

message GetPetPanelResponse {
  PetPanelView panel = 1;
}

message BuyPetRequest {
  uint32 pet_id = 1;
  uint64 expected_config_version = 2;
}

message BuyPetResponse {
  uint32 pet_id = 1;
  int64 price_coins = 2;
  PlayerStatePatch patch = 3;
  PetPanelView panel = 4;
}

message DeployPetRequest {
  uint32 pet_id = 1;
}

message DeployPetResponse {
  uint32 active_pet_id = 1;
  PlayerStatePatch patch = 2;
  PetPanelView panel = 3;
}

message BuyPetFoodRequest {
  uint32 shop_entry_id = 1;
  uint32 quantity = 2;
  uint64 expected_price_version = 3;
}

message BuyPetFoodResponse {
  uint32 shop_entry_id = 1;
  uint32 item_id = 2;
  uint32 quantity = 3;
  int64 unit_price = 4;
  int64 total_price = 5;
  PlayerStatePatch patch = 6;
  PetPanelView panel = 7;
}

message FeedPetRequest {}

message FeedPetResponse {
  int64 food_active_until_ms = 1;
  PlayerStatePatch patch = 2;
  PetPanelView panel = 3;
}

message SendFriendGiftRequest {
  uint64 recipient_player_id = 1;
  uint32 crop_item_id = 2;
  uint32 quantity = 3;
}

message SendFriendGiftResponse {
  bytes outbox_event_id = 1;
  uint32 crop_item_id = 2;
  uint32 quantity = 3;
  PlayerStatePatch patch = 4;
}

message ClaimMailRequest {
  string mail_id = 1;
}

message ClaimMailResponse {
  string mail_id = 1;
  repeated ItemStackView items_added = 2;
  PlayerStatePatch patch = 3;
  int64 coins_added = 4;
}

// MailKind mirrors classicfarm.mail.v1.MailKind for H5 without circular imports.
enum MailKind {
  MAIL_KIND_UNSPECIFIED = 0;
  MAIL_KIND_PUBLIC = 1;
  MAIL_KIND_PRIVATE = 2;
  MAIL_KIND_GIFT = 3;
}

message MailAttachmentView {
  uint32 item_id = 1;
  uint32 quantity = 2;
  int64 coin_amount = 3;
}

message MailView {
  string mail_id = 1;
  MailKind kind = 2;
  int64 created_at_ms = 3;
  int64 published_at_ms = 4;
  string sender_display_name = 5;
  uint64 sender_player_id = 6;
  uint64 recipient_player_id = 7;
  string title = 8;
  string content = 9;
  repeated MailAttachmentView attachments = 10;
  bool read = 11;
  bool claimed = 12;
  int64 coin_amount = 13;
}

message OpenMailboxRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message OpenMailboxResponse {
  repeated MailView mails = 1;
  string next_page_token = 2;
  int64 last_mailbox_opened_at_ms = 3;
}

message MarkMailReadRequest {
  string mail_id = 1;
}

message MarkMailReadResponse {}

message CheckMailboxIndicatorRequest {}

// CheckMailboxIndicatorResponse lets H5 recover the mailbox red dot after a
// reconnect: RED_DOT_CHANGED Push only reaches players who were online when
// the mail arrived, and public mail never pushes at all.
message CheckMailboxIndicatorResponse {
  bool has_new_mail = 1;
}
