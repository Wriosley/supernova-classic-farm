syntax = "proto3";

package classicfarm.rpc.v1;

import "classicfarm/v1/data/data_model.proto";
import "classicfarm/v1/ws/ws.proto";

option go_package = "github.com/Wriosley/supernova-classic-farm/server/gen/classicfarm/v1/rpc;rpcv1";

// Runtime calls are unary and require x-cf-caller-service, x-cf-timestamp,
// x-cf-nonce, x-cf-body-sha256 and x-cf-signature metadata. Game commands use
// a five-second client deadline.
service GameCommandService {
  rpc ExecutePlayerCommand(ExecutePlayerCommandRequest) returns (ExecutePlayerCommandResponse);
}

// Enter, heartbeat and exit use a three-second client deadline. Friend actions
// use a five-second client deadline.
service VisitorZoneService {
  rpc EnterFriendFarm(EnterFriendFarmRequest) returns (EnterFriendFarmResponse);
  rpc HeartbeatFriendFarm(HeartbeatFriendFarmRequest) returns (HeartbeatFriendFarmResponse);
  rpc ExitFriendFarm(ExitFriendFarmRequest) returns (ExitFriendFarmResponse);
  rpc ExecuteFriendAction(ExecuteFriendActionRequest) returns (ExecuteFriendActionResponse);
}

// Owner-farm reads and visit lease calls use a three-second client deadline.
// ApplyVisitorAction uses a five-second client deadline.
service OwnerFarmService {
  rpc EnterVisitor(EnterVisitorRequest) returns (EnterVisitorResponse);
  rpc RefreshVisitorHeartbeat(RefreshVisitorHeartbeatRequest) returns (RefreshVisitorHeartbeatResponse);
  rpc ExitVisitor(ExitVisitorRequest) returns (ExitVisitorResponse);
  rpc GetPublicFarmSnapshot(GetPublicFarmSnapshotRequest) returns (GetPublicFarmSnapshotResponse);
  rpc ApplyVisitorAction(ApplyVisitorActionRequest) returns (ApplyVisitorActionResponse);
}

// Push calls use a two-second client deadline.
service GatePushService {
  rpc PublishPlayerStateChanged(PublishPlayerStateChangedRequest) returns (PublishPlayerStateChangedResponse);
  rpc PublishFarmViewPatch(PublishFarmViewPatchRequest) returns (PublishFarmViewPatchResponse);
  rpc PublishFarmPresence(PublishFarmPresenceRequest) returns (PublishFarmPresenceResponse);
  rpc PublishRedDotChanged(PublishRedDotChangedRequest) returns (PublishRedDotChangedResponse);
}

// Player connection registration uses a two-second client deadline. Gate AUTH
// registers, refreshes every 30s (Zone lease 90s), and unregisters on disconnect.
service PlayerConnectionService {
  rpc RegisterPlayerConnection(RegisterPlayerConnectionRequest) returns (RegisterPlayerConnectionResponse);
  rpc RefreshPlayerConnection(RefreshPlayerConnectionRequest) returns (RefreshPlayerConnectionResponse);
  rpc UnregisterPlayerConnection(UnregisterPlayerConnectionRequest) returns (UnregisterPlayerConnectionResponse);
}

// Zone notification fan-out uses a two-second client deadline. InfoSvr routes
// red-dot events here; the Zone Dispatcher looks up Gate connections.
service ZoneNotificationService {
  rpc DispatchRedDot(DispatchRedDotRequest) returns (DispatchRedDotResponse);
}

// Task-credit calls use a five-second client deadline.
service PlayerSocialService {
  rpc ApplyFriendTaskCredit(ApplyFriendTaskCreditRequest) returns (ApplyFriendTaskCreditResponse);
  rpc ApplyMailReward(ApplyMailRewardRequest) returns (ApplyMailRewardResponse);
}

message CommittedRoute {
  uint32 logical_shard_id = 1;
  string owner_zone_id = 2;
  uint64 owner_epoch = 3;
  uint64 route_version = 4;
}

message ExecutePlayerCommandRequest {
  uint64 caller_player_id = 1;
  string gate_id = 2;
  CommittedRoute route = 3;
  classicfarm.ws.v1.WsEnvelope envelope = 4;
}

message ExecutePlayerCommandResponse {
  classicfarm.ws.v1.WsEnvelope envelope = 1;
}

message EnterFriendFarmRequest {
  uint64 caller_player_id = 1;
  uint64 owner_player_id = 2;
  string gate_id = 3;
  string request_id = 4;
}

message EnterFriendFarmResponse {
  classicfarm.ws.v1.EnterFriendFarmResponse result = 1;
  classicfarm.ws.v1.Error error = 15;
}

message HeartbeatFriendFarmRequest {
  uint64 caller_player_id = 1;
  uint64 owner_player_id = 2;
  bytes visit_id = 3;
  string gate_id = 4;
  string request_id = 5;
}

message HeartbeatFriendFarmResponse {
  classicfarm.ws.v1.FarmHeartbeatResponse result = 1;
  classicfarm.ws.v1.Error error = 15;
}

message ExitFriendFarmRequest {
  uint64 caller_player_id = 1;
  uint64 owner_player_id = 2;
  bytes visit_id = 3;
  string gate_id = 4;
  string request_id = 5;
}

message ExitFriendFarmResponse {
  classicfarm.ws.v1.Error error = 15;
}

message ExecuteFriendActionRequest {
  uint64 caller_player_id = 1;
  uint64 owner_player_id = 2;
  bytes visit_id = 3;
  string gate_id = 4;
  string request_id = 5;
  classicfarm.data.v1.FriendInteractionAction action = 6;
  uint32 plot_id = 7;
  optional uint32 pest_id = 8;
  // STEAL_FRIEND_CROP only: visitor-visible crop + farm view version for
  // reserve and stale-request rejection. Owner Actor re-validates.
  uint32 expected_crop_item_id = 9;
  bytes farm_view_epoch = 10;
  uint64 farm_view_seq = 11;
}

message ExecuteFriendActionResponse {
  classicfarm.ws.v1.FriendActionResponse result = 1;
  classicfarm.ws.v1.Error error = 15;
}

message EnterVisitorRequest {
  CommittedRoute owner_route = 1;
  uint64 owner_player_id = 2;
  uint64 visitor_player_id = 3;
  string gate_id = 4;
  bytes relation_id = 5;
  string request_id = 6;
}

message EnterVisitorResponse {
  bytes visit_id = 1;
  int64 expires_at_ms = 2;
  classicfarm.ws.v1.FarmVisitSnapshot snapshot = 3;
  classicfarm.ws.v1.Error error = 15;
}

message RefreshVisitorHeartbeatRequest {
  CommittedRoute owner_route = 1;
  uint64 owner_player_id = 2;
  uint64 visitor_player_id = 3;
  bytes visit_id = 4;
  string gate_id = 5;
}

message RefreshVisitorHeartbeatResponse {
  int64 expires_at_ms = 1;
  classicfarm.ws.v1.Error error = 15;
}

message ExitVisitorRequest {
  CommittedRoute owner_route = 1;
  uint64 owner_player_id = 2;
  uint64 visitor_player_id = 3;
  bytes visit_id = 4;
}

message ExitVisitorResponse {
  classicfarm.ws.v1.Error error = 15;
}

message GetPublicFarmSnapshotRequest {
  CommittedRoute owner_route = 1;
  uint64 owner_player_id = 2;
  uint64 visitor_player_id = 3;
  bytes visit_id = 4;
}

message GetPublicFarmSnapshotResponse {
  classicfarm.ws.v1.FarmVisitSnapshot snapshot = 1;
  classicfarm.ws.v1.Error error = 15;
}

message ApplyVisitorActionRequest {
  CommittedRoute owner_route = 1;
  uint64 owner_player_id = 2;
  uint64 visitor_player_id = 3;
  bytes visit_id = 4;
  bytes interaction_id = 5;
  classicfarm.data.v1.FriendInteractionAction action = 6;
  uint32 plot_id = 7;
  optional uint32 pest_id = 8;
  bytes request_digest_sha256 = 9;
  uint32 expected_crop_item_id = 10;
  bytes farm_view_epoch = 11;
  uint64 farm_view_seq = 12;
}

message ApplyVisitorActionResponse {
  bytes result_digest_sha256 = 1;
  bytes result_payload = 2;
  classicfarm.ws.v1.FarmViewPatch farm_patch = 3;
  classicfarm.ws.v1.Error error = 15;
}

message PublishPlayerStateChangedRequest {
  string gate_id = 1;
  uint64 recipient_player_id = 2;
  classicfarm.ws.v1.WsEnvelope envelope = 3;
}

message PublishFarmViewPatchRequest {
  string gate_id = 1;
  repeated uint64 recipient_player_ids = 2;
  classicfarm.ws.v1.FarmViewPatch patch = 3;
}

message PublishFarmPresenceRequest {
  string gate_id = 1;
  uint64 recipient_player_id = 2;
  classicfarm.ws.v1.FarmPresencePush presence = 3;
}

message PublishRedDotChangedRequest {
  string gate_id = 1;
  repeated uint64 recipient_player_ids = 2;
  classicfarm.ws.v1.RedDotChangedPush red_dot = 3;
}

message PublishPlayerStateChangedResponse {}

message PublishFarmViewPatchResponse {}

message PublishFarmPresenceResponse {}

message PublishRedDotChangedResponse {}

message DispatchRedDotRequest {
  classicfarm.rpc.v1.CommittedRoute recipient_route = 1;
  repeated uint64 recipient_player_ids = 2;
  classicfarm.ws.v1.RedDotChangedPush red_dot = 3;
}

message DispatchRedDotResponse {
  classicfarm.ws.v1.Error error = 15;
}

message RegisterPlayerConnectionRequest {
  uint64 player_id = 1;
  string gate_id = 2;
  string connection_id = 3;
  CommittedRoute route = 4;
  int64 expires_at_ms = 5;
}

message RegisterPlayerConnectionResponse {
  classicfarm.ws.v1.Error error = 15;
}

message RefreshPlayerConnectionRequest {
  uint64 player_id = 1;
  string gate_id = 2;
  string connection_id = 3;
  CommittedRoute route = 4;
  int64 expires_at_ms = 5;
}

message RefreshPlayerConnectionResponse {
  classicfarm.ws.v1.Error error = 15;
}

message UnregisterPlayerConnectionRequest {
  uint64 player_id = 1;
  string gate_id = 2;
  string connection_id = 3;
  CommittedRoute route = 4;
}

message UnregisterPlayerConnectionResponse {
  classicfarm.ws.v1.Error error = 15;
}

message ApplyFriendTaskCreditRequest {
  CommittedRoute player_route = 1;
  uint64 player_id = 2;
  bytes relation_id = 3;
}

message ApplyFriendTaskCreditResponse {
  bool newly_applied = 1;
  uint64 player_seq = 2;
  classicfarm.ws.v1.Error error = 15;
}

message MailRewardAttachment {
  uint32 item_id = 1;
  uint32 quantity = 2;
}

message ApplyMailRewardRequest {
  CommittedRoute player_route = 1;
  uint64 player_id = 2;
  bytes claim_id = 3;
  string mail_id = 4;
  repeated MailRewardAttachment attachments = 5;
  int64 coin_amount = 6;
}

message ApplyMailRewardResponse {
  bool newly_applied = 1;
  uint64 player_seq = 2;
  repeated classicfarm.ws.v1.ItemStackView items_added = 3;
  classicfarm.ws.v1.PlayerStatePatch patch = 4;
  // owner_epoch pairs with player_seq so callers can rebuild the StateVersion
  // that H5 needs to apply patch incrementally.
  uint64 owner_epoch = 5;
  int64 coins_added = 6;
  classicfarm.ws.v1.Error error = 15;
}
